name: Analytics quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analytics dependencies
        run: python -m pip install --upgrade pip duckdb
      - name: Compile Python
        run: python -m py_compile dashboard/app.py scripts/*.py
      - name: Run data quality checks
        run: python scripts/run_quality_checks.py
      - name: Run model regression tests
        run: python tests/test_model.py
